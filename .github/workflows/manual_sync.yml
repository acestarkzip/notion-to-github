name: Manual Sync & Init (Safe)

on:
  workflow_dispatch:
    inputs:
      reset_readme:
        description: 'README.md의 템플릿/글 목록 영역만 초기화합니다. TIL 게시글 .md 파일은 삭제하지 않습니다.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notion-til-manual-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 실행 전에 현재 저장소에 존재하는 TIL 게시글 목록을 기록합니다.
      # _assets/README.md는 이미지 갤러리이므로 보호 대상 게시글에서 제외합니다.
      - name: Record existing TIL Markdown posts
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -- 'TIL/*.md' 'TIL/**/*.md' \
            | awk 'tolower($0) ~ /^til\/.*\.md$/ && tolower($0) !~ /_assets\//' \
            > "$RUNNER_TEMP/til-markdown-before.txt"
          echo "보호할 기존 TIL 게시글 수: $(wc -l < "$RUNNER_TEMP/til-markdown-before.txt")"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run Notion exporter
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FETCH_MODE: 'ALL'
          RESET_MODE: ${{ inputs.reset_readme }}
        run: python update_readme.py

      # 기존 TIL 게시글이 하나라도 사라졌으면 Push하지 않습니다.
      - name: Stage generated files and protect existing posts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r post; do
            [[ -z "$post" ]] && continue
            if [[ ! -f "$post" ]]; then
              echo "::error::기존 TIL 게시글이 작업 중 삭제되었습니다: $post"
              echo "안전을 위해 Commit/Push를 중단합니다."
              exit 1
            fi
          done < "$RUNNER_TEMP/til-markdown-before.txt"

          # 자동화가 관리하는 경로만 스테이징합니다.
          # blog/, images/, index.html 등 다른 파일은 건드리지 않습니다.
          git add -A -- TIL README.md

          deleted_posts="$(git diff --cached --diff-filter=D --name-only \
            | awk 'tolower($0) ~ /^til\/.*\.md$/ && tolower($0) !~ /_assets\//')"

          if [[ -n "$deleted_posts" ]]; then
            echo "::error::기존 TIL Markdown 게시글 삭제가 감지되었습니다."
            printf '%s\n' "$deleted_posts"
            echo "안전을 위해 Commit/Push를 중단합니다."
            exit 1
          fi

          echo "기존 TIL 게시글 삭제 없음: 안전 검사 통과"
          git diff --cached --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋하지 않습니다."
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m "docs: update notion TIL"

          # 다른 작업이 먼저 Push했을 경우 원격 변경을 반영한 뒤 재검사합니다.
          git pull --rebase origin "${GITHUB_REF_NAME}"

          while IFS= read -r post; do
            [[ -z "$post" ]] && continue
            if [[ ! -f "$post" ]]; then
              echo "::error::원격 변경을 반영한 뒤 기존 TIL 게시글이 사라졌습니다: $post"
              echo "안전을 위해 Push를 중단합니다."
              exit 1
            fi
          done < "$RUNNER_TEMP/til-markdown-before.txt"

          git push origin "HEAD:${GITHUB_REF_NAME}"
