name: Update Notion Log (Safe Overlay)

on:
  schedule:
    # 매일 한국 시간 19:00: 오늘(TODAY) 작성된 문서를 동기화합니다.
    - cron: '0 19 * * *'
      timezone: 'Asia/Seoul'
    # 매일 한국 시간 07:00: 전날(YESTERDAY) 작성된 문서를 다시 동기화합니다.
    - cron: '0 7 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      fetch_mode:
        description: '수동 실행 조회 범위: ALL(전체), Yesterday(어제), Today(오늘)'
        required: true
        type: choice
        options:
          - ALL
          - Yesterday
          - Today
        default: ALL

# 이 workflow는 현재 저장소를 읽고, Pages 저장소는 SSH Deploy Key로 업데이트합니다.
permissions:
  contents: read

# 수동/예약 실행이 동시에 목적지 저장소에 쓰지 않도록 직렬화합니다.
concurrency:
  group: notion-til-pages-safe-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) 원본 자동화 저장소: acestarkzip/notion-to-github
      - name: Checkout Notion exporter repository
        uses: actions/checkout@v7
        with:
          # update_readme.py는 Pages 저장소가 아니라 acestarkzip/notion-to-github의 master 루트에서 실행됩니다.
          ref: master
          fetch-depth: 1

      - name: Confirm exporter version and source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Exporter repository: $(git remote get-url origin)"
          echo "Exporter branch: $(git branch --show-current)"
          echo "Exporter commit: $(git rev-parse --short HEAD)"
          echo "Exporter script: $(pwd)/update_readme.py"
          grep -n '^EXPORTER_VERSION =' update_readme.py || {
            echo "::error::업데이트된 update_readme.py가 notion-to-github/master 루트에 없습니다."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      # 예약 시간에 따라 조회 날짜를 명시적으로 결정합니다.
      # 19:00 KST 실행은 TODAY, 다음 날 07:00 KST 실행은 YESTERDAY입니다.
      # 수동 실행에서는 ALL / Yesterday / Today 선택값을 사용합니다.
      - name: Resolve fetch mode (KST schedule and manual choice)
        id: fetch-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_FETCH_MODE: ${{ inputs.fetch_mode }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE_CRON" in
              '0 19 * * *') FETCH_MODE="TODAY" ;;
              '0 7 * * *') FETCH_MODE="YESTERDAY" ;;
              *)
                echo "::error::알 수 없는 예약 cron입니다: $SCHEDULE_CRON"
                exit 1
                ;;
            esac
          else
            case "${INPUT_FETCH_MODE,,}" in
              all) FETCH_MODE="ALL" ;;
              yesterday) FETCH_MODE="YESTERDAY" ;;
              today) FETCH_MODE="TODAY" ;;
              *)
                echo "::error::잘못된 수동 조회 범위입니다: $INPUT_FETCH_MODE"
                exit 1
                ;;
            esac
          fi

          echo "FETCH_MODE=$FETCH_MODE" >> "$GITHUB_ENV"
          echo "fetch_mode=$FETCH_MODE" >> "$GITHUB_OUTPUT"
          echo ">> 선택된 조회 범위: $FETCH_MODE (KST)"

      - name: Run Notion exporter
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FETCH_MODE: ${{ steps.fetch-mode.outputs.fetch_mode }}
          RESET_MODE: 'false'
          GITHUB_RAW_BASE_URL: https://raw.githubusercontent.com/acestarkzip/acestarkzip.github.io/main
        run: python update_readme.py

      # 출력이 없으면 빈 데이터를 배포하지 않고 정상 종료합니다.
      - name: Check generated TIL files
        id: output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("TIL")
          posts = []
          if root.is_dir():
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() != ".md":
                      continue
                  relative_parts = path.relative_to(root).parts
                  if any(part.lower().endswith("_assets") for part in relative_parts):
                      continue
                  if path.name.lower() == "readme.md":
                      continue
                  posts.append(path)

          print(f"Notion 게시글 Markdown 수: {len(posts)}")
          has_posts = "true" if posts else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_posts={has_posts}\n")
          if not posts:
              print("이번 실행에서 배포할 TIL 게시글이 없습니다. 기존 Pages 파일은 변경하지 않습니다.")
          PY

      # 2) 목적지 Pages 저장소를 별도 폴더에 checkout합니다.
      # SSH_DEPLOY_KEY는 acestarkzip.github.io 저장소에 등록된 쓰기 권한 Deploy Key여야 합니다.
      - name: Checkout GitHub Pages repository
        if: steps.output.outputs.has_posts == 'true'
        uses: actions/checkout@v7
        with:
          repository: acestarkzip/acestarkzip.github.io
          ref: main
          path: pages-site
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: true

      # 3) 목적지에 이미 있던 모든 Markdown 경로를 기록하고,
      # TIL을 삭제 없이 병합합니다. 기존 수동 작성 Markdown과 경로가 충돌하면
      # 기존 파일은 그대로 두고 __notion 이름의 별도 파일로 추가합니다.
      - name: Merge generated TIL without deleting existing files
        if: steps.output.outputs.has_posts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import filecmp
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          source_root = Path("TIL")
          destination_repo = Path("pages-site")
          destination_root = destination_repo / "TIL"
          manifest_path = Path(os.environ["RUNNER_TEMP"]) / "existing-markdown-before.json"

          if not source_root.is_dir():
              raise SystemExit("[ERROR] 생성된 TIL 폴더가 없습니다.")
          if not destination_repo.is_dir():
              raise SystemExit("[ERROR] Pages 저장소 checkout에 실패했습니다.")

          def markdown_paths(repo_root: Path):
              result = []
              for path in repo_root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() != ".md":
                      continue
                  if ".git" in path.relative_to(repo_root).parts:
                      continue
                  result.append(path.relative_to(repo_root).as_posix())
              return sorted(result)

          def is_asset_area(relative_path: Path) -> bool:
              return any(part.lower().endswith("_assets") for part in relative_path.parts)

          def is_notion_managed_markdown(path: Path) -> bool:
              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  return False
              # 기존 exporter가 생성한 TIL 파일의 메타데이터 표식입니다.
              return "> 원본 노션:" in content or "<!-- notion-to-github-managed -->" in content

          def local_asset_references(markdown_path: Path, asset_folder_name: str) -> set[str]:
              """게시글 본문에서 특정 _assets 폴더의 로컬 파일 참조만 추출합니다."""
              from urllib.parse import quote, unquote
              try:
                  text = markdown_path.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  return set()
              # update_readme.py는 Markdown 상대경로에 한글 폴더/파일명을 URL 인코딩합니다.
              # raw 표기와 percent-encoded 표기를 모두 인식합니다.
              encoded_folder = quote(asset_folder_name, safe="")
              folder_pattern = "(?:" + "|".join(
                  re.escape(value) for value in {asset_folder_name, encoded_folder}
              ) + ")"
              pattern = re.compile(
                  rf"(?:\./)?{folder_pattern}/([^\s)\"'>]+)"
              )
              return {unquote(match.group(1)) for match in pattern.finditer(text)}

          def remove_stale_referenced_assets(
              old_post: Path,
              new_post: Path,
              relative_post_path: Path,
          ) -> None:
              """기존 게시글이 참조했지만 새 게시글에는 없는 미디어만 해당 _assets에서 정리합니다.

              기존 .md, 미참조 수동 파일, 다른 게시글의 자산 폴더는 삭제하지 않습니다.
              새 게시글에 로컬 자산 참조가 하나도 없으면 안전상 삭제를 생략합니다.
              """
              import re
              asset_folder_name = f"{relative_post_path.stem}_assets"
              old_refs = local_asset_references(old_post, asset_folder_name)
              new_refs = local_asset_references(new_post, asset_folder_name)
              if not new_refs:
                  print(
                      f"[ASSET CLEANUP SKIP] 새 게시글에 로컬 자산 참조가 없어 기존 자산 보존: "
                      f"{relative_post_path.as_posix()}"
                  )
                  return

              stale_names = old_refs - new_refs
              asset_dir = destination_root / relative_post_path.parent / asset_folder_name
              for name in sorted(stale_names):
                  # 폴더 탈출/하위 경로 삭제를 방지하고, 해당 폴더의 바로 아래 파일만 다룹니다.
                  if Path(name).name != name or name in {"", "README.md"}:
                      continue
                  candidate = asset_dir / name
                  if candidate.is_file() and candidate.parent.resolve() == asset_dir.resolve():
                      candidate.unlink()
                      print(f"[REMOVE STALE GENERATED ASSET] {candidate.relative_to(destination_repo).as_posix()}")

          existing_markdown_before = markdown_paths(destination_repo)
          manifest_path.write_text(
              json.dumps(existing_markdown_before, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          destination_root.mkdir(parents=True, exist_ok=True)
          added = 0
          updated = 0
          unchanged = 0
          conflicts = []

          source_files = sorted(p for p in source_root.rglob("*") if p.is_file())
          for source_file in source_files:
              if source_file.is_symlink():
                  print(f"[WARN] 심볼릭 링크는 복사하지 않습니다: {source_file}")
                  continue

              relative_path = source_file.relative_to(source_root)
              target_file = destination_root / relative_path
              target_file.parent.mkdir(parents=True, exist_ok=True)

              if not target_file.exists():
                  shutil.copy2(source_file, target_file)
                  added += 1
                  print(f"[ADD] {relative_path.as_posix()}")
                  continue

              if target_file.is_dir():
                  conflicts.append(f"파일/폴더 경로 충돌: {target_file}")
                  continue

              same = filecmp.cmp(source_file, target_file, shallow=False)
              if same:
                  unchanged += 1
                  continue

              if source_file.suffix.lower() == ".md":
                  if is_asset_area(relative_path):
                      # _assets/README.md는 자동 생성 갤러리이므로 새 버전으로 갱신합니다.
                      shutil.copy2(source_file, target_file)
                      updated += 1
                      print(f"[UPDATE ASSET GALLERY] {relative_path.as_posix()}")
                  elif is_notion_managed_markdown(target_file):
                      # Notion 메타데이터가 확인되는 기존 자동 생성 문서만 갱신합니다.
                      # 이름 변경으로 더 이상 사용하지 않는 기존 미디어 파일만 해당 _assets에서 정리합니다.
                      remove_stale_referenced_assets(target_file, source_file, relative_path)
                      shutil.copy2(source_file, target_file)
                      updated += 1
                      print(f"[UPDATE NOTION POST] {relative_path.as_posix()}")
                  else:
                      # 같은 경로에 수동 작성 파일이 있으면 원본을 절대 덮어쓰지 않습니다.
                      # 대신 __notion 접미사의 별도 파일을 만들어 두 기록을 모두 보존합니다.
                      base = target_file.with_name(f"{target_file.stem}__notion{target_file.suffix}")
                      safe_target = base
                      suffix_number = 2

                      while safe_target.exists():
                          if safe_target.is_file() and is_notion_managed_markdown(safe_target):
                              break
                          if safe_target.is_file() and filecmp.cmp(source_file, safe_target, shallow=False):
                              break
                          safe_target = target_file.with_name(
                              f"{target_file.stem}__notion-{suffix_number}{target_file.suffix}"
                          )
                          suffix_number += 1

                      if safe_target.exists() and safe_target.is_file():
                          if filecmp.cmp(source_file, safe_target, shallow=False):
                              unchanged += 1
                              print(f"[UNCHANGED CONFLICT-SAFE COPY] {safe_target.relative_to(destination_repo).as_posix()}")
                          else:
                              if is_notion_managed_markdown(safe_target):
                                  remove_stale_referenced_assets(safe_target, source_file, relative_path)
                              shutil.copy2(source_file, safe_target)
                              updated += 1
                              print(f"[UPDATE CONFLICT-SAFE NOTION COPY] {safe_target.relative_to(destination_repo).as_posix()}")
                      else:
                          safe_target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(source_file, safe_target)
                          added += 1
                          print(f"[ADD CONFLICT-SAFE NOTION COPY] {safe_target.relative_to(destination_repo).as_posix()}")
              elif is_asset_area(relative_path):
                  # 페이지별 _assets 내부 미디어는 해당 Notion 페이지의 새 원본으로 갱신합니다.
                  shutil.copy2(source_file, target_file)
                  updated += 1
                  print(f"[UPDATE ASSET] {relative_path.as_posix()}")
              else:
                  conflicts.append(
                      f"기존 파일 보호를 위해 충돌 파일 덮어쓰기를 중단했습니다: {target_file}"
                  )

          if conflicts:
              for message in conflicts:
                  print(f"::error::{message}")
              raise SystemExit(
                  "동일한 경로에 기존 수동 파일이 있어 안전을 위해 배포를 중단했습니다. "
                  "기존 파일은 변경하지 않았습니다."
              )

          existing_markdown_after = set(markdown_paths(destination_repo))
          missing = sorted(set(existing_markdown_before) - existing_markdown_after)
          if missing:
              for item in missing:
                  print(f"::error::기존 Markdown 파일이 사라졌습니다: {item}")
              raise SystemExit("기존 Markdown 보존 검사 실패. 배포를 중단합니다.")

          print("--- 병합 결과 ---")
          print(f"새 파일: {added}")
          print(f"갱신 파일: {updated}")
          print(f"변경 없음: {unchanged}")
          print(f"기존 Markdown 보존 확인: {len(existing_markdown_before)}개")
          print("기존 Markdown은 삭제하지 않았습니다. 변경된 페이지에서 더 이상 참조되지 않는 기존 미디어만 정리했습니다.")
          PY

      # 4) TIL만 스테이징합니다. Pages 저장소의 README.md, index.html, blog/, images/ 등은 건드리지 않습니다.
      - name: Stage TIL changes and reject deletions
        if: steps.output.outputs.has_posts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C pages-site add -A -- TIL

          # Markdown 게시글 삭제는 차단합니다. 이름 변경으로 새 글에서 더 이상 참조하지 않는
          # 기존 _assets 미디어 파일은 병합 단계에서 안전하게 정리할 수 있습니다.
          deleted_posts="$(git -C pages-site diff --cached --name-only --diff-filter=D -- TIL \
            | awk 'tolower($0) ~ /^til\/.*\.md$/ && tolower($0) !~ /_assets\//')"
          if [[ -n "$deleted_posts" ]]; then
            echo "::error::기존 TIL Markdown 게시글 삭제가 감지되어 Push를 중단합니다."
            printf '%s\n' "$deleted_posts"
            exit 1
          fi

          # Notion에서 가져온 Markdown에는 줄 끝 공백(trailing whitespace)이
          # 포함될 수 있습니다. 이는 게시글 삭제/손상과 무관하므로 배포를 막지 않고
          # 경고만 표시합니다. 실제 파일 삭제는 위의 diff-filter=D 검사로 차단합니다.
          if git -C pages-site diff --cached --check; then
            echo "공백 검사 통과"
          else
            echo "::warning::Markdown에 줄 끝 공백이 있습니다. 콘텐츠 보존을 위해 이 경고만으로 배포를 중단하지 않습니다."
          fi

          git -C pages-site diff --cached --stat

      # 5) 원격 변경을 rebase한 뒤에도 실행 시작 시 존재했던 Markdown이 모두 남아 있는지 재검사합니다.
      - name: Commit and push safely
        if: steps.output.outputs.has_posts == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git -C pages-site diff --cached --quiet; then
            echo "배포할 변경 사항이 없습니다. 기존 파일은 그대로 유지합니다."
            exit 0
          fi

          git -C pages-site config user.name "${GITHUB_ACTOR}"
          git -C pages-site config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git -C pages-site commit -m "docs: safely merge Notion TIL"
          git -C pages-site pull --rebase origin main

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = Path("pages-site")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "existing-markdown-before.json"
          previous = json.loads(manifest.read_text(encoding="utf-8"))
          missing = [relative for relative in previous if not (repo / relative).is_file()]
          if missing:
              for relative in missing:
                  print(f"::error::Push 전 기존 Markdown 누락 감지: {relative}")
              raise SystemExit("기존 Markdown 보존 검사 실패. Push를 중단합니다.")
          print(f"기존 Markdown {len(previous)}개가 모두 유지되었습니다.")
          PY

          deleted_after_rebase="$(git -C pages-site diff --name-only --diff-filter=D origin/main...HEAD -- TIL \
            | awk 'tolower($0) ~ /^til\/.*\.md$/ && tolower($0) !~ /_assets\//')"
          if [[ -n "$deleted_after_rebase" ]]; then
            echo "::error::Rebase 후 기존 TIL Markdown 삭제가 감지되어 Push를 중단합니다."
            printf '%s\n' "$deleted_after_rebase"
            exit 1
          fi

          git -C pages-site push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "Notion → GitHub Pages 안전 병합 작업이 종료되었습니다."
          echo "기존 파일은 삭제하지 않으며 수동 작성 Markdown과 경로가 충돌하면 __notion 별도 파일로 보존합니다."
          echo "기존 파일 삭제 방식(cpina push-to-another-repository)은 사용하지 않습니다."
