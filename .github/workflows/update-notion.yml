name: Update Notion Log

on:
  schedule:
    # 매일 15:05 UTC (한국 시간 00:05) 실행
    - cron: '5 15 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python update_readme.py
        
      - name: Commit and Push to GitHub Pages Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: 'TIL'  # 내 레포지토리에서 노션 파일들이 생성되는 폴더 이름 (예: TIL 또는 docs 등 본인 환경에 맞게 수정)
          destination-github-username: 'acestarkzip'
          destination-repository-name: 'acestarkzip.github.io'
          user-email: 'acestark.zip@gmail.com'
          target-directory: 'TIL'  # 상대방 블로그 레포지토리의 어디에 저장할지 지정
          target-branch: 'main'
  
